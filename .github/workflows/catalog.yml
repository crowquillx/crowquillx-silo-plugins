name: Catalog

on:
  push:
    branches: [main]
  pull_request:
  # Fallback refresh every 15 minutes. GitHub can silently fail to register
  # schedules; a push touching this file re-registers them.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  # Fired by plugin release workflows (event_type plugin-released) for
  # near-instant refresh after a release.
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: write

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Test catalog generator
        run: python -m unittest discover -s tests
      - name: Generate catalog
        run: python scripts/update_catalog.py
      - name: Verify committed catalog
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- repository.json
      - name: Commit refreshed catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          if git diff --quiet -- repository.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository.json
          git commit -m "catalog: refresh plugin index"
          git push
